&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;realm-count-feasibility&#x27;);
  const data = JSON.parse(root.querySelector(&#x27;[data-samples]&#x27;).textContent);
  const inputs = {structures: {}, biomes: {}};
  const byId = Object.fromEntries(data.layouts.map(row =&gt; [row.id, row]));
  const sharedNames = [&#x27;desert_pyramid&#x27;,&#x27;jungle_temple&#x27;,&#x27;swamp_hut&#x27;,&#x27;igloo&#x27;];
  function rows(kind, selector) {
    const body = root.querySelector(selector);
    data[kind].forEach(item =&gt; {
      const row = document.createElement(&#x27;tr&#x27;);
      const label = document.createElement(&#x27;th&#x27;);
      label.scope = &#x27;row&#x27;; label.textContent = item.label;
      const request = document.createElement(&#x27;td&#x27;); request.className = &#x27;requirement&#x27;;
      const input = document.createElement(&#x27;input&#x27;);
      input.type = &#x27;number&#x27;; input.className = &#x27;form-control&#x27;; input.min = &#x27;0&#x27;; input.max = String(item.ceiling); input.step = &#x27;1&#x27;;
      input.setAttribute(&#x27;aria-label&#x27;, &#x27;Required &#x27; + item.label + (kind === &#x27;structures&#x27; ? &#x27; starts&#x27; : &#x27; distinct biome IDs&#x27;));
      inputs[kind][item.name] = input; request.append(input);
      const observed = document.createElement(&#x27;td&#x27;); observed.className = &#x27;numeric&#x27;; observed.textContent = item.observed;
      const ceiling = document.createElement(&#x27;td&#x27;); ceiling.className = &#x27;numeric&#x27;; ceiling.textContent = item.ceiling.toLocaleString();
      row.append(label,request,observed,ceiling); body.append(row);
      input.addEventListener(&#x27;input&#x27;, () =&gt; { update(); persist(); });
    });
  }
  rows(&#x27;structures&#x27;,&#x27;[data-structure-rows]&#x27;); rows(&#x27;biomes&#x27;,&#x27;[data-biome-rows]&#x27;);
  function getGoals(kind) {
    return data[kind].map(item =&gt; Number(inputs[kind][item.name].value));
  }
  function passes(counts, goals) { return counts.every((value, index) =&gt; value &gt;= goals[index]); }
  function update() {
    const structureGoals = getGoals(&#x27;structures&#x27;), biomeGoals = getGoals(&#x27;biomes&#x27;);
    root.querySelectorAll(&#x27;[data-example]&#x27;).forEach(button =&gt; {
      const preset = data.presets[button.dataset.example];
      const matches = [&#x27;structures&#x27;,&#x27;biomes&#x27;].every(kind =&gt; data[kind].every(item =&gt;
        Number(inputs[kind][item.name].value) === (preset[kind][item.name] || 0)));
      button.setAttribute(&#x27;aria-pressed&#x27;,String(matches));
    });
    let error = &#x27;&#x27;;
    [&#x27;structures&#x27;,&#x27;biomes&#x27;].forEach(kind =&gt; data[kind].forEach(item =&gt; {
      const v = Number(inputs[kind][item.name].value);
      if (!Number.isInteger(v) || v &lt; 0 || v &gt; item.ceiling || inputs[kind][item.name].value === &#x27;&#x27;) error = &#x27;Invalid count for &#x27; + item.label + &#x27;: allowed 0–&#x27; + item.ceiling + &#x27;.&#x27;;
    }));
    const sharedTotal = sharedNames.reduce((sum,name) =&gt; sum + Number(inputs.structures[name].value),0);
    if (!error &amp;&amp; sharedTotal &gt; 16) error = &#x27;Shared feature demand: &#x27; + sharedTotal + &#x27; starts exceeds the 16-slot ceiling.&#x27;;
    const validation = root.querySelector(&#x27;[data-validation]&#x27;); validation.textContent = error; validation.hidden = !error;
    root.querySelector(&#x27;[data-shared]&#x27;).textContent = &#x27;Shared pyramid / temple / hut / igloo slots: &#x27; + sharedTotal + &#x27; required, at most 16 available&#x27;;
    const structures = error ? 0 : data.layouts.filter(r =&gt; passes(r.counts,structureGoals)).length;
    const biomes = data.biomeLayouts.filter(r =&gt; passes(r.counts,biomeGoals)).length;
    const both = error ? 0 : data.biomeLayouts.filter(r =&gt; passes(r.counts,biomeGoals) &amp;&amp; passes(byId[r.id].counts,structureGoals)).length;
    const values = {structures,biomes,both}, totals = {structures:data.layouts.length,biomes:data.biomeLayouts.length,both:data.biomeLayouts.length};
    Object.keys(values).forEach(key =&gt; {
      root.querySelector(&#x27;[data-result=&quot;&#x27;+key+&#x27;&quot;]&#x27;).textContent = values[key] + &#x27; / &#x27; + totals[key] + &#x27; matches&#x27;;
      const bar = root.querySelector(&#x27;[data-bar=&quot;&#x27;+key+&#x27;&quot;]&#x27;);
      bar.style.width = (100*values[key]/totals[key]) + &#x27;%&#x27;; bar.parentElement.setAttribute(&#x27;aria-valuenow&#x27;,values[key]);
    });
  }
  function state() {
    return Object.fromEntries([&#x27;structures&#x27;,&#x27;biomes&#x27;].map(kind =&gt; [kind,Object.fromEntries(data[kind].map(item =&gt; [item.name,Number(inputs[kind][item.name].value)]))]));
  }
  function apply(value) {
    [&#x27;structures&#x27;,&#x27;biomes&#x27;].forEach(kind =&gt; data[kind].forEach(item =&gt; {
      const n = value &amp;&amp; value[kind] &amp;&amp; value[kind][item.name];
      inputs[kind][item.name].value = Number.isInteger(n) &amp;&amp; n &gt;= 0 &amp;&amp; n &lt;= item.ceiling ? n : 0;
    })); update();
  }
  function persist() {
    if (window.openai &amp;&amp; typeof window.openai.setWidgetState === &#x27;function&#x27;) {
      window.openai.setWidgetState({modelContent:state(),privateContent:null}).catch(() =&gt; {});
    }
  }
  root.querySelectorAll(&#x27;[data-example]&#x27;).forEach(button =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; { apply(data.presets[button.dataset.example]); persist(); });
  });
  const saved = window.openai &amp;&amp; window.openai.widgetState;
  apply(saved &amp;&amp; saved.modelContent &amp;&amp; saved.modelContent.structures ? saved.modelContent : data.presets.core);
  window.addEventListener(&#x27;openai:set_globals&#x27;,event =&gt; {
    const incoming = event.detail &amp;&amp; event.detail.globals &amp;&amp; event.detail.globals.widgetState;
    if (incoming &amp;&amp; incoming.modelContent &amp;&amp; incoming.modelContent.structures) apply(incoming.modelContent);
  });
})();

        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
